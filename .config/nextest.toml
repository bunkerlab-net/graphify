[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "fail"
final-status-level = "flaky"
failure-output = "immediate-final"
success-output = "never"

[profile.ci]
retries = 2
fail-fast = false
status-level = "all"
final-status-level = "all"
failure-output = "immediate-final"
success-output = "final"

[profile.coverage]
retries = 0
fail-fast = false
status-level = "fail"
failure-output = "immediate-final"

[[profile.default.overrides]]
filter = "test(/^net::/) + test(/_network_/)"
threads-required = 1
