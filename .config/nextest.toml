[profile.default]
fail-fast = false
failure-output = "immediate-final"
final-status-level = "flaky"
retries = 0
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "fail"
success-output = "never"

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
final-status-level = "all"
retries = 2
status-level = "all"
success-output = "final"

[profile.coverage]
fail-fast = false
failure-output = "immediate-final"
retries = 0
status-level = "fail"

[[profile.default.overrides]]
filter = "test(/^net::/) + test(/_network_/)"
threads-required = 1
