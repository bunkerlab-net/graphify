[advisories]
# All four advisories are "unmaintained" informational notices (not security
# vulnerabilities) reaching us transitively through `neo4rs 0.8.0`. The upstream
# fix lands in `neo4rs 0.9` (currently 0.9.0-rc.9). Revisit once `neo4rs 0.9`
# ships stable and we can bump.
ignore = [
  "RUSTSEC-2025-0012", # backoff unmaintained (via neo4rs)
  "RUSTSEC-2024-0384", # instant unmaintained (via backoff via neo4rs)
  "RUSTSEC-2024-0436", # paste unmaintained (via neo4rs)
  "RUSTSEC-2025-0134", # rustls-pemfile unmaintained (via neo4rs)
]
