[package]
description = "LLM router (Kimi, Ollama, Bedrock, Gemini, OpenAI, Claude CLI)"
edition.workspace = true
license.workspace = true
name = "graphify-llm"
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
aws-config = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "credentials-process",
  "default-https-client",
  "rt-tokio",
  "sso",
] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
graphify-security = { workspace = true }
indexmap = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tiktoken-rs = "0.12"
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
ureq = { workspace = true, features = ["json"] }
url = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
