[package]
description = "Tree-sitter extraction for 26+ programming languages"
edition.workspace = true
license.workspace = true
name = "graphify-extract"
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
flate2 = "1.1"
graphify-cache = { workspace = true }
graphify-security = { workspace = true }
indexmap = { workspace = true }
quick-xml = "0.40"
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
walkdir = { workspace = true }

# Core tree-sitter + language grammars (workspace versions)
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-dm = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

# Additional language grammars (crates.io)
# tree-sitter-kotlin 0.3.x pulls tree-sitter 0.20 which conflicts with workspace 0.23.
# Use the -ng fork which targets newer tree-sitter.
tree-sitter-elixir = "0.3"
tree-sitter-fortran = "0.6"
tree-sitter-groovy = "0.1"
tree-sitter-julia = "0.23"
tree-sitter-kotlin-ng = "1"
tree-sitter-lua = "0.5"
tree-sitter-objc = "3.0"
tree-sitter-powershell = "0.26"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-verilog = "1.0"
tree-sitter-zig = "1.1"

[dev-dependencies]
graphify-build = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
