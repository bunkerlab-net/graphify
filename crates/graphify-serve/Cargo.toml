[package]
description = "MCP stdio server"
edition.workspace = true
license.workspace = true
name = "graphify-serve"
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
axum = { version = "0.8", optional = true }
chrono = { workspace = true }
graphify-analyze = { workspace = true }
graphify-build = { workspace = true }
graphify-prs = { workspace = true }
graphify-reflect = { workspace = true }
graphify-security = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "io-std",
  "io-util",
  "net",
  "sync",
] }
unicode-normalization = { workspace = true }

[features]
# Streamable HTTP transport for `graphify serve --transport http` (mirrors
# graphify-py's optional `mcp` extra: mcp + starlette + uvicorn). Off by default
# so the stdio server stays free of the axum/tower/hyper tree.
http = ["dep:axum"]

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
tower = { version = "0.5" }

[lints]
workspace = true
