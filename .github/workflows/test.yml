name: Test

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
        include:
          - runs-on: ubuntu-24.04
            arch: x86-64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
          - runs-on: macos-26
            arch: arm64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          components: llvm-tools

      - name: Capture rustc fingerprint
        id: rustc
        run: echo "fingerprint=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup Mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        env:
          MISE_JOBS: 4
        with:
          cache_key_prefix: mise
          cache: true
          experimental: true
          install: true

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-test-${{ steps.rustc.outputs.fingerprint }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-test-${{ steps.rustc.outputs.fingerprint }}-

      - name: Install Binstall
        env:
          BINSTALL_VERSION: v1.20.0 # https://github.com/cargo-bins/cargo-binstall/releases/latest
          BINSTALL_SHA: d3a93702160e0ec03e2a4e996855db1f01adee801fb84a43add24e0877ef8eae
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          commit_sha=$(curl -fsSL --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/cargo-bins/cargo-binstall/git/ref/tags/${BINSTALL_VERSION}" \
            | jq -r '.object.sha')
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${commit_sha}/install-from-binstall-release.sh" \
            -o /tmp/binstall-install.sh
          echo "${BINSTALL_SHA}  /tmp/binstall-install.sh" | shasum -a 256 --check
          bash /tmp/binstall-install.sh

      - name: Install Nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall -y --force cargo-nextest cargo-llvm-cov

      - run: cargo llvm-cov --workspace nextest

      - if: matrix.runs-on != 'ubuntu-24.04'
        run: cargo llvm-cov --all-features --workspace nextest
      - if: matrix.runs-on == 'ubuntu-24.04'
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info nextest

      # TODO: re-enable once Codecov is set up for this repo.
      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
      #   if: matrix.runs-on == 'ubuntu-24.04'
      #   with:
      #     fail_ci_if_error: true
      #     files: lcov.info
      #     use_oidc: true

  # Live integration tests for the optional `postgres` / `falkordb` features,
  # which the feature-flag unit tests can only verify by compilation. Runs the
  # `net_*` tests against real service containers (Linux-only — GitHub service
  # containers are not available on macOS runners). FalkorDB, not plain Redis,
  # is required because the push speaks the `GRAPH.QUERY` graph-module command.
  integration:
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}

    # Both Linux architectures. macOS is intentionally absent: GitHub service
    # containers are Linux-only and FalkorDB has no macOS/Homebrew build, so the
    # `net_*` tests self-skip there (the macOS `run` job leaves the URLs unset).
    strategy:
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runs-on: ubuntu-24.04
            arch: x86-64
          - runs-on: ubuntu-24.04-arm
            arch: arm64

    permissions:
      contents: read

    services:
      postgres:
        image: docker.io/postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      falkordb:
        image: docker.io/falkordb/falkordb:v4.18.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GRAPHIFY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      GRAPHIFY_TEST_FALKORDB_URL: localhost:6379

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - name: Capture rustc fingerprint
        id: rustc
        run: echo "fingerprint=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-integration-${{ steps.rustc.outputs.fingerprint }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-integration-${{ steps.rustc.outputs.fingerprint }}-

      - name: Install Binstall
        env:
          BINSTALL_VERSION: v1.20.0 # https://github.com/cargo-bins/cargo-binstall/releases/latest
          BINSTALL_SHA: d3a93702160e0ec03e2a4e996855db1f01adee801fb84a43add24e0877ef8eae
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          commit_sha=$(curl -fsSL --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/cargo-bins/cargo-binstall/git/ref/tags/${BINSTALL_VERSION}" \
            | jq -r '.object.sha')
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${commit_sha}/install-from-binstall-release.sh" \
            -o /tmp/binstall-install.sh
          echo "${BINSTALL_SHA}  /tmp/binstall-install.sh" | shasum -a 256 --check
          bash /tmp/binstall-install.sh

      - name: Install Nextest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall -y --force cargo-nextest

      - name: Run live integration tests (postgres + falkordb)
        run: cargo nextest run -p graphify-extract -p graphify-export --all-features -E 'test(net_)'
