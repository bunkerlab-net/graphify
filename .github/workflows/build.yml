name: Build

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}

    permissions:
      contents: read

    strategy:
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
        include:
          - runs-on: ubuntu-24.04
            arch: x86-64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
          - runs-on: macos-26
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      # `--all-features` enables the `postgres` feature, which pulls `native-tls`.
      # No extra OpenSSL setup step is needed: the GitHub-hosted ubuntu runners
      # ship libssl-dev + pkg-config preinstalled — `lint.yml`'s
      # `clippy --all-features` and `test.yml`'s `llvm-cov --all-features`
      # already compile native-tls on these same runners — and macOS native-tls
      # uses the Security framework. There is no Windows runner in this matrix.
      - run: cargo build --release --all-features

      - id: artifact-name
        run: |-
          os=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          sha=$(git rev-parse --short HEAD)
          echo "name=graphify-$os-${{ matrix.arch }}-$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ steps.artifact-name.outputs.name }}
          path: target/release/graphify
